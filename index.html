<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Login Demo</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">

        <section class="intro">
            <h1>facebook</h1>
            <p>
                Terhubung dengan teman dan berbagai hal
                yang penting bagi kamu.
            </p>
        </section>

        <section class="login-card">

            <form id="loginForm">

                <input
                    type="email"
                    id="email"
                    placeholder="Email atau nomor telepon"
                    required
                >

                <input
                    type="password"
                    id="demoPassword"
                    placeholder="Password demo"
                    required
                >

                <button type="submit" class="login-button">
                    Masuk
                </button>

                <a href="#" class="forgot">
                    Lupa password?
                </a>

                <div class="divider"></div>

                <button type="button" class="create-button">
                    Buat akun baru
                </button>

                <p class="demo-notice">
                    Demo tampilan — password tidak disimpan
                    atau dikirim ke server.
                </p>

            </form>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
